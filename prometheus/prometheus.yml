global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: hpc-lab

rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter on every cluster node
  - job_name: node
    file_sd_configs:
      - files: ["/etc/prometheus/targets/node.yml"]

  # prometheus-slurm-exporter on the Slurm controller
  - job_name: slurm
    scrape_interval: 60s
    scrape_timeout: 50s
    file_sd_configs:
      - files: ["/etc/prometheus/targets/slurm.yml"]

  # NVIDIA DCGM exporter on GPU nodes
  - job_name: dcgm
    file_sd_configs:
      - files: ["/etc/prometheus/targets/dcgm.yml"]
