rule_files:
  - ../rules/gpu.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="dcgm", instance="gpu-01:9400", gpu="0", Hostname="gpu-01"}'
        values: "0 0 79 79 79"
    alert_rule_test:
      - eval_time: 1m
        alertname: GPUXidError
        exp_alerts: []
      - eval_time: 3m
        alertname: GPUXidError
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dcgm
              instance: gpu-01:9400
              gpu: "0"
              Hostname: gpu-01
            exp_annotations:
              summary: "GPU 0 on gpu-01 reported an XID error"
              description: "XID errors point to driver, memory or hardware faults. Drain the node and check: nvidia-smi -q"

  - interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS{job="dcgm", instance="gpu-01:9400", gpu="1", Hostname="gpu-01"}'
        values: "0x10 1x10"
      - series: 'DCGM_FI_DEV_ROW_REMAP_FAILURE{job="dcgm", instance="gpu-01:9400", gpu="1", Hostname="gpu-01"}'
        values: "0x10 1x10"
    alert_rule_test:
      - eval_time: 5m
        alertname: GPUUncorrectableMemoryError
        exp_alerts: []
      - eval_time: 5m
        alertname: GPURowRemapFailure
        exp_alerts: []
      - eval_time: 15m
        alertname: GPUUncorrectableMemoryError
        exp_alerts:
          - exp_labels:
              severity: warning
              job: dcgm
              instance: gpu-01:9400
              gpu: "1"
              Hostname: gpu-01
            exp_annotations:
              summary: "GPU 1 on gpu-01 remapped a memory row after an uncorrectable error"
              description: "The remap takes effect after a GPU reset. Drain the node, let jobs finish, then reset the GPU (nvidia-smi -r) or reboot."
      - eval_time: 15m
        alertname: GPURowRemapFailure
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dcgm
              instance: gpu-01:9400
              gpu: "1"
              Hostname: gpu-01
            exp_annotations:
              summary: "GPU 1 on gpu-01 failed to remap a memory row"
              description: "The GPU has no spare rows left and is not safe for jobs. Keep the node drained and open a hardware ticket (RMA)."

  - interval: 1m
    input_series:
      - series: 'slurm_gpus_alloc{job="slurm", instance="head:8080"}'
        values: "4x90"
      - series: 'DCGM_FI_DEV_GPU_UTIL{job="dcgm", instance="gpu-01:9400", gpu="0", Hostname="gpu-01"}'
        values: "2x90"
      - series: 'DCGM_FI_DEV_GPU_UTIL{job="dcgm", instance="gpu-01:9400", gpu="1", Hostname="gpu-01"}'
        values: "6x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: GPUsAllocatedButIdle
        exp_alerts: []
      - eval_time: 70m
        alertname: GPUsAllocatedButIdle
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "Allocated GPUs have averaged under 10% utilisation for an hour"
              description: "Look for interactive sessions or jobs that hold GPUs without using them."
