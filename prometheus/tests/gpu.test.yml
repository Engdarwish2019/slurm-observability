rule_files:
  - ../rules/gpu.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'DCGM_FI_DEV_XID_ERRORS{job="dcgm", instance="gpu-01:9400", gpu="0", Hostname="gpu-01"}'
        values: "0 0 79 79 79"
    alert_rule_test:
      - eval_time: 1m
        alertname: GPUXidError
        exp_alerts: []
      - eval_time: 3m
        alertname: GPUXidError
        exp_alerts:
          - exp_labels:
              severity: critical
              job: dcgm
              instance: gpu-01:9400
              gpu: "0"
              Hostname: gpu-01
            exp_annotations:
              summary: "GPU 0 on gpu-01 reported an XID error"
              description: "XID errors point to driver, memory or hardware faults. Drain the node and check: nvidia-smi -q"

  - interval: 1m
    input_series:
      - series: 'slurm_gpus_alloc{job="slurm", instance="head:8080"}'
        values: "4x90"
      - series: 'DCGM_FI_DEV_GPU_UTIL{job="dcgm", instance="gpu-01:9400", gpu="0", Hostname="gpu-01"}'
        values: "2x90"
      - series: 'DCGM_FI_DEV_GPU_UTIL{job="dcgm", instance="gpu-01:9400", gpu="1", Hostname="gpu-01"}'
        values: "6x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: GPUsAllocatedButIdle
        exp_alerts: []
      - eval_time: 70m
        alertname: GPUsAllocatedButIdle
        exp_alerts:
          - exp_labels:
              severity: info
            exp_annotations:
              summary: "Allocated GPUs have averaged under 10% utilisation for an hour"
              description: "Look for interactive sessions or jobs that hold GPUs without using them."
