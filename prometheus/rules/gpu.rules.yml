groups:
  - name: gpu
    rules:
      - alert: DCGMExporterDown
        expr: up{job="dcgm"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU metrics are missing from {{ $labels.instance }}"
          description: "dcgm-exporter is unreachable on {{ $labels.instance }}."

      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} is above 85C"
          description: "Sustained high temperature leads to clock throttling. Check airflow and fans."

      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS != 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} reported an XID error"
          description: "XID errors point to driver, memory or hardware faults. Drain the node and check: nvidia-smi -q"

      # GPUs are allocated to jobs but barely used: wasted, expensive capacity.
      - alert: GPUsAllocatedButIdle
        expr: max(slurm_gpus_alloc) > 0 and avg(DCGM_FI_DEV_GPU_UTIL) < 10
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Allocated GPUs have averaged under 10% utilisation for an hour"
          description: "Look for interactive sessions or jobs that hold GPUs without using them."
