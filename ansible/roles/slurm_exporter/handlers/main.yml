---
- name: Build slurm_exporter
  ansible.builtin.command:
    cmd: go build -o /usr/local/bin/prometheus-slurm-exporter .
    chdir: "{{ slurm_exporter_build_dir }}"
  environment:
    GOCACHE: /tmp/go-cache
    GOPATH: /tmp/go
  changed_when: true

- name: Restart slurm_exporter
  ansible.builtin.systemd_service:
    name: prometheus-slurm-exporter
    state: restarted
    daemon_reload: true
