---
- name: Create the node_exporter user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Download node_exporter and verify its checksum
  ansible.builtin.get_url:
    url: "{{ node_exporter_base_url }}/{{ node_exporter_tarball }}"
    dest: /tmp/{{ node_exporter_tarball }}
    checksum: "sha256:{{ node_exporter_base_url }}/sha256sums.txt"
    mode: "0644"

- name: Unpack node_exporter
  ansible.builtin.unarchive:
    src: /tmp/{{ node_exporter_tarball }}
    dest: /tmp
    remote_src: true
    creates: /tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter

- name: Install the binary
  ansible.builtin.copy:
    src: /tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: node_exporter
    mode: "0775"

- name: Install the systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Allow scraping from the monitoring server only
  ansible.posix.firewalld:
    rich_rule: rule family="ipv4" source address="{{ item }}" port port="{{ node_exporter_port }}" protocol="tcp" accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ node_exporter_allowed_sources }}"

- name: Enable node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
