---
- name: Add the NVIDIA container toolkit repository
  ansible.builtin.get_url:
    url: "{{ dcgm_exporter_toolkit_repo }}"
    dest: /etc/yum.repos.d/nvidia-container-toolkit.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Podman and the NVIDIA container toolkit
  ansible.builtin.dnf:
    name:
      - podman
      - nvidia-container-toolkit
    state: present

- name: Generate the CDI spec so containers can request GPUs
  ansible.builtin.command:
    cmd: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    creates: /etc/cdi/nvidia.yaml

- name: Install the systemd unit
  ansible.builtin.template:
    src: dcgm-exporter.service.j2
    dest: /etc/systemd/system/dcgm-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart dcgm_exporter

- name: Allow scraping from the monitoring server only
  ansible.posix.firewalld:
    rich_rule: rule family="ipv4" source address="{{ item }}" port port="{{ dcgm_exporter_port }}" protocol="tcp" accept
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ dcgm_exporter_allowed_sources }}"

- name: Enable the DCGM exporter
  ansible.builtin.systemd_service:
    name: dcgm-exporter
    state: started
    enabled: true
    daemon_reload: true
