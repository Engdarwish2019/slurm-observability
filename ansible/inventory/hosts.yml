---
# Same groups as ansible-hpc-roles, so one inventory can drive both repositories.
all:
  vars:
    ansible_user: vagrant
    monitoring_server: 192.168.60.1
  children:
    slurm_controller:
      hosts:
        head:
          ansible_host: 192.168.60.10
    slurm_compute:
      children:
        slurm_cpu:
          hosts:
            compute-01:
              ansible_host: 192.168.60.11
            compute-02:
              ansible_host: 192.168.60.12
        slurm_gpu:
          hosts: {}
