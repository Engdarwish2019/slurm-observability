---
- name: Generate Prometheus file_sd targets from the inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    targets_dir: "{{ playbook_dir }}/../../prometheus/targets"
    targets_jobs:
      - file: node.yml
        hosts: "{{ groups['all'] | difference(['localhost']) | sort }}"
        port: 9100
        role: hpc
      - file: slurm.yml
        hosts: "{{ groups['slurm_controller'] | default([]) }}"
        port: 8080
        role: slurm-controller
      - file: dcgm.yml
        hosts: "{{ groups['slurm_gpu'] | default([]) }}"
        port: 9400
        role: gpu
  tasks:
    - name: Write one target file per job
      ansible.builtin.copy:
        dest: "{{ targets_dir }}/{{ item.file }}"
        mode: "0644"
        content: |
          # Generated by ansible/playbooks/targets.yml. Do not edit by hand.
          {% if item.hosts | length == 0 %}
          []
          {% else %}
          - targets:
          {% for host in item.hosts %}
              - {{ hostvars[host].ansible_host | default(host) }}:{{ item.port }}
          {% endfor %}
            labels:
              role: {{ item.role }}
          {% endif %}
      loop: "{{ targets_jobs }}"
      loop_control:
        label: "{{ item.file }}"
