global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: oncall
      repeat_interval: 1h
    - matchers:
        - severity="info"
      receiver: default
      repeat_interval: 24h

inhibit_rules:
  # A node that is fully down should not also page for its filesystems or units.
  - source_matchers:
      - alertname="NodeExporterDown"
    target_matchers:
      - severity=~"warning|info"
    equal: [instance]

receivers:
  - name: default
    webhook_configs:
      - url: http://127.0.0.1:5001/alerts
        send_resolved: true

  # Replace with Slack, PagerDuty or Teams. Keep tokens in files, not in this repo:
  #   slack_configs:
  #     - api_url_file: /etc/alertmanager/secrets/slack_webhook
  #       channel: "#hpc-oncall"
  - name: oncall
    webhook_configs:
      - url: http://127.0.0.1:5001/oncall
        send_resolved: true
